<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellum | Home</title>

    <meta name="description"
        content="Stellum: Explore the universe with NASA's Astronomy Picture of the Day and curated deep space imagery.">
    <meta name="author" content="David Burguete">

    <link rel="icon" href="images/logo.png" type="image/png">

    <meta property="og:title" content="Stellum Space Gallery">
    <meta property="og:type" content="website">
    <meta property="og:description"
        content="Discover the cosmos through NASA's lens. A dynamic gallery of space imagery.">
    <meta property="og:image" content="https://davidbte06.github.io/wdd231/project-stellum/images/social-card.png">
    <meta property="og:url" content="https://davidbte06.github.io/wdd231/project-stellum/index.html">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">

    <script type="module" src="scripts/main.js"></script>
</head>

<body>

    <main style="text-align: center; padding: 4rem 1rem;">
        <h1>Transmission Received</h1>
        <p>Thank you for contacting Stellum.</p>

        <div class="confirmation-box"
            style="margin-top: 2rem; border: 1px solid white; padding: 2rem; display: inline-block;">
            <p>Welcome to the crew, <strong id="user-name"></strong>!</p>
            <p>We have sent a confirmation to: <strong id="user-email"></strong></p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="index.html" class="cta-button">Return to Base</a>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('fname');
        const email = urlParams.get('email');

        if (name) {
            document.getElementById('user-name').textContent = name;
        }
        if (email) {
            document.getElementById('user-email').textContent = email;
        }
    </script>

    <footer>
        <div class="footer-content">

            <div class="footer-section">
                <h3>STELLUM</h3>
                <p>Exploring the cosmos, one pixel at a time.</p>
            </div>

            <div class="footer-section">
                <h3>Connect</h3>
                <div class="social-links">
                    <a href="https://instagram.com" target="_blank">Instagram</a>
                    <a href="https://twitter.com" target="_blank">X (Twitter)</a>
                    <a href="https://github.com" target="_blank">GitHub</a>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <p>&copy; <span id="year"></span> Stellum Project | <span id="lastModified"></span></p>
        </div>
    </footer>

</body>

</html>
